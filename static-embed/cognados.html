      pointer-events: all;
      transition: color 0.3s;

      border: none;
      background: none;

      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #1e3631;
      line-height: 1.8;

      top: 20px;
      left: 20px;
      font-size: 13px;
      letter-spacing: 0.14em;

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tERPgOoUUAzPgAAAgZqFmTAAKPA/wDMGAAACCCMCZ8EAp0VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tURPiO4UpeS/ggE/o0oAjfAAABBCQBMGAAACB4ACYMAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//sURO6P8AAAf4AAAAgZgAizAAABAAAB/gAAACAAAD/AAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.decodeAudioData(bytes.buffer.slice(0), buf => {
        audioBuffer = buf;
      });
    }

    function playHit() {
      if (!audioBuffer || !audioCtx) return;
      if (capasActivas >= MAX_CAPAS) return;

      capasActivas++;
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      src.buffer = audioBuffer;
      src.connect(gain);
      gain.connect(audioCtx.destination);
      // volumen aleatorio sutil
      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(1.001, audioCtx.currentTime + 0.0004);
      src.start(audioCtx.currentTime);
      src.stop(audioCtx.currentTime + 15.65);
      src.onended = () => { capasActivas--; };
    }

    class Palabra {
      constructor(text, color) {
        this.text = text;
        this.color = color;
        this.x = 80 + Math.random() * (W - 160);
        this.y = 80 + Math.random() * (H - 160);
        this.size = 16 + Math.random() * 68;
        this.alpha = 0;
        this.born = performance.now() / 1000;
        this.maxLife = 2.5 + Math.random() * 2;
      }

      update(t) {
        const life = t - this.born;
        const p = life / this.maxLife;
        if (p < 0.15) this.alpha = p / 0.15;
        else if (p > 0.7) this.alpha = (1 - p) / 0.3;
        else this.alpha = 1;
        return life < this.maxLife;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = `${Math.round(this.size)}px Space Grotesk`;
        ctx.fillStyle = this.color;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    let activas = [];
    let lastSpawn = 0;
    let lastAudio = 0;

    function spawnPalabra() {
      const f = FAMILIAS[familiaIdx];
      const text = f.palabras[Math.floor(Math.random() * f.palabras.length)];
      activas.push(new Palabra(text, f.color));
      lastSpawn = performance.now() / 1000;
    }

    function loop(ts) {
      const t = ts / 1000;
      ctx.fillStyle = 'rgba(3,3,3,0.15)';
      ctx.fillRect(0, 0, W, H);

      // Palabras: siempre aparecen, ritmo según estado del clic
      const spawnInterval = clicking ? SPAWN_INTERVAL_CLICKING : SPAWN_INTERVAL_IDLE;
      if (t - lastSpawn > spawnInterval) {
        spawnPalabra();
      }

      // Audio: solo se repite mientras mantienes presionado
      if (clicking && t - lastAudio > AUDIO_INTERVAL_CLICKING) {
        playHit();
        lastAudio = t;
      }

      activas = activas.filter(p => p.update(t));
      activas.forEach(p => p.draw());

      requestAnimationFrame(loop);
    }

    // ─── Eventos de ratón ────────────────────────────────
    canvas.addEventListener('mousedown', () => {
      initAudio();
      clicking = true;
      // primera palabra y sonido inmediatos
      spawnPalabra();
      playHit();
      lastAudio = performance.now() / 1000;
    });

    canvas.addEventListener('mouseup', () => {
      clicking = false;
      lastAudio = 0;
    });

    // ─── Eventos táctiles ────────────────────────────────
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      initAudio();
      clicking = true;
      spawnPalabra();
      playHit();
      lastAudio = performance.now() / 1000;
    });

    canvas.addEventListener('touchend', () => {
      clicking = false;
      lastAudio = 0;
    });

    // ─── Botones de raíz ─────────────────────────────────
    document.querySelectorAll('.raiz-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        initAudio();
        familiaIdx = parseInt(btn.dataset.i);
        document.querySelectorAll('.raiz-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activas = [];
        spawnPalabra();
        playHit(); // sonido al cambiar de raíz
      });
    });

    // ─── Atajos de teclado 1-4 ───────────────────────────
    document.addEventListener('keydown', e => {
      const keys = {'1':0,'2':1,'3':2,'4':3};
      if (keys[e.key] !== undefined) {
        initAudio();
        familiaIdx = keys[e.key];
        document.querySelectorAll('.raiz-btn').forEach((b,i) => b.classList.toggle('active', i===familiaIdx));
        activas = [];
        spawnPalabra();
        playHit(); // sonido al cambiar de raíz
      }
    });

    // ─── Redimensionar ────────────────────────────────────
    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // ─── Arranque ─────────────────────────────────────────
    requestAnimationFrame(loop);
  </script>
</body>
</html>
