const COLORS = {
  floresta: '#4db896',
  rizoma:   '#9b8fd4',
  micelio:  '#c8a055',
  espora:   '#3a5248'
};

const SIZES = {
  floresta: 7,
  rizoma:   5,
  micelio:  4,
  espora:   3
};

const W = window.innerWidth;
const H = window.innerHeight;
const canvas = document.getElementById('grafo');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

// Inicializar posiciones
NODES.forEach(n => {
  n.x = W/2 + (Math.random()-0.5)*W*0.7;
  n.y = H/2 + (Math.random()-0.5)*H*0.7;
  n.vx = 0; n.vy = 0;
  n.r = SIZES[n.estado] || 3;
});

// Adyacencia para highlight
const adj = {};
NODES.forEach(n => adj[n.id] = new Set());
EDGES.forEach(([a,b]) => { adj[a].add(b); adj[b].add(a); });

let hovered = null;

function simulate() {
  const repulsion = 1200;
  const spring = 0.008;
  const restLen = 100;
  const damping = 0.82;

  for (let i = 0; i < NODES.length; i++) {
    for (let j = i+1; j < NODES.length; j++) {
      const dx = NODES[j].x - NODES[i].x;
      const dy = NODES[j].y - NODES[i].y;
      const dist = Math.sqrt(dx*dx+dy*dy) || 1;
      const force = repulsion / (dist*dist);
      NODES[i].vx -= force*dx/dist;
      NODES[i].vy -= force*dy/dist;
      NODES[j].vx += force*dx/dist;
      NODES[j].vy += force*dy/dist;
    }
  }

  EDGES.forEach(([a,b]) => {
    const dx = NODES[b].x - NODES[a].x;
    const dy = NODES[b].y - NODES[a].y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const force = (dist - restLen) * spring;
    NODES[a].vx += force*dx/dist;
    NODES[a].vy += force*dy/dist;
    NODES[b].vx -= force*dx/dist;
    NODES[b].vy -= force*dy/dist;
  });

  NODES.forEach(n => {
    n.vx += (W/2 - n.x) * 0.001;
    n.vy += (H/2 - n.y) * 0.002;
    n.vx *= damping;
    n.vy *= damping;
    n.x = Math.max(n.r+5, Math.min(W-n.r-5, n.x + n.vx));
    n.y = Math.max(n.r+5, Math.min(H-n.r-5, n.y + n.vy));
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Edges
  EDGES.forEach(([a,b]) => {
    const isHighlighted = hovered && (hovered.id === a || hovered.id === b);
    ctx.beginPath();
    ctx.moveTo(NODES[a].x, NODES[a].y);
    ctx.lineTo(NODES[b].x, NODES[b].y);
    ctx.strokeStyle = isHighlighted ? '#2a6650' : '#0f1d18';
    ctx.lineWidth = isHighlighted ? 1.2 : 1.2;
    ctx.stroke();
  });

  // Nodes
  NODES.forEach(n => {
    const isHov = hovered && hovered.id === n.id;
    const isAdj = hovered && adj[hovered.id].has(n.id);
    const color = COLORS[n.estado] || '#3a5248';
    const r = isHov ? n.r + 3 : n.r;
    const alpha = hovered ? (isHov || isAdj ? 'ff' : '33') : 'aa';

    if (isHov) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r+8, 0, Math.PI*2);
      ctx.fillStyle = color + '18';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle = color + alpha;
    ctx.fill();
  });
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  hovered = null;
  for (const n of NODES) {
    if (Math.sqrt((mx-n.x)**2+(my-n.y)**2) < n.r+6) {
      hovered = n;
      break;
    }
  }
  if (hovered) {
    tooltip.style.opacity = '1';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 20) + 'px';
    tooltip.textContent = hovered.title;
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.opacity = '20';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('mouseleave', () => {
  hovered = null;
  tooltip.style.opacity = '0';
});

canvas.addEventListener('click', () => {
  if (!hovered) return;
  const slug = hovered.title
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-')
    .replace(/[^a-z0-9-]/g, '');
  window.open('https://darangoq.github.io/quartz/' + slug, '_blank');
});

function loop() {
  simulate();
  draw();
  requestAnimationFrame(loop);
}

loop();
